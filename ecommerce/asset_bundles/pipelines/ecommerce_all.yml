definitions:
  base_retry_parameters: &base_retry_parameters
    timeout_seconds: 1800
    max_retries: 1
    min_retry_interval_millis: 120000
    retry_on_timeout: true

resources:
  jobs:
    ecommerce_all:

      name: ecommerce_all

      base_params: &base_params
        env: "${var.env}"
        log_level: "${{job.parameters.log_level}}"

      parameters:
        - name: run_id
          default: ""
        - name: ingestion_nb_layer
          default: bronze
        - name: log_level
          default: "INFO"

      tags:
        product: "${var.ecommerce_product_tag}"

      job_clusters:
        - job_cluster_key: ecommerce_job_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 16.4.x-scala2.13
            node_type_id: Standard_D4s_v3
            data_security_mode: DATA_SECURITY_MODE_AUTO
            runtime_engine: STANDARD
            kind: CLASSIC_PREVIEW
            is_single_node: true

      email_notifications:
        on_failure:
          - ${var.notification_email}
        no_alert_for_skipped_runs: true
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true

      schedule:
        quartz_cron_expression: 55 0 1 1 * ?
        timezone_id: UTC
        pause_status: UNPAUSED

      queue:
        enabled: true

      tasks:

        #BRONZE LAYER
        - task_key: pl_file_ingestion_orders
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/bronze/nb_file_ingestion
            base_parameters:
              <<: *base_params
              config_filename: orders.json
            source: WORKSPACE

        - task_key: pl_file_ingestion_payments
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/bronze/nb_file_ingestion
            base_parameters:
              <<: *base_params
              config_filename: payments.json
            source: WORKSPACE

        - task_key: pl_file_ingestion_users
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/bronze/nb_file_ingestion
            base_parameters:
              <<: *base_params
              config_filename: users.json
            source: WORKSPACE

        - task_key: pl_file_ingestion_categories
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/bronze/nb_file_ingestion
            base_parameters:
              <<: *base_params
              config_filename: categories.json
            source: WORKSPACE

        - task_key: pl_file_ingestion_products
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/bronze/nb_file_ingestion
            base_parameters:
              <<: *base_params
              config_filename: products.json
            source: WORKSPACE

        - task_key: pl_file_ingestion_behavioral
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/bronze/nb_file_ingestion
            base_parameters:
              <<: *base_params
              config_filename: behavioral_data.json
            source: WORKSPACE


        #SILVER LAYER
        - task_key: pl_categories_silver
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_file_ingestion_categories
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/silver/nb_categories
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_products_silver
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_file_ingestion_products
            - task_key: pl_categories_silver
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/silver/nb_products
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_users_silver
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_file_ingestion_users
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/silver/nb_users
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_orders_silver
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_file_ingestion_orders
            - task_key: pl_users_silver
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/silver/nb_orders
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_order_items_silver
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_file_ingestion_orders
            - task_key: pl_orders_silver
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/silver/nb_order_items
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_payments_silver
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_file_ingestion_payments
            - task_key: pl_orders_silver
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/silver/nb_payments
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_sessions_silver
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_file_ingestion_behavioral
            - task_key: pl_users_silver
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/silver/nb_sessions
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_event_clickstream_silver
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_file_ingestion_behavioral
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/silver/nb_event_clickstream
            base_parameters:
              <<: *base_params
            source: WORKSPACE


        #GOLD LAYER (DIMENSIONS)
        - task_key: pl_dim_date
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/gold/nb_dim_date
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_dim_time
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/gold/nb_dim_time
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_dim_geography
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_users_silver
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/gold/nb_dim_geography
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_dim_user
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_users_silver
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/gold/nb_dim_user
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_dim_product
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_products_silver
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/gold/nb_dim_product
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_dim_session
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_sessions_silver
            - task_key: pl_event_clickstream_silver
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/gold/nb_dim_session
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_dim_event_type
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_event_clickstream_silver
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/gold/nb_dim_event_type
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_dim_payment_type
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_payments_silver
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/gold/nb_dim_payment_type
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_dim_sales_context
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_orders_silver
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/gold/nb_dim_sales_context
            base_parameters:
              <<: *base_params
            source: WORKSPACE


        #GOLD LAYER (FACTS)
        - task_key: pl_fact_sales
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_orders_silver
            - task_key: pl_order_items_silver
            - task_key: pl_payments_silver
            - task_key: pl_dim_date
            - task_key: pl_dim_time
            - task_key: pl_dim_product
            - task_key: pl_dim_user
            - task_key: pl_dim_geography
            - task_key: pl_dim_payment_type
            - task_key: pl_dim_sales_context
            - task_key: pl_dim_session
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/gold/nb_fact_sales
            base_parameters:
              <<: *base_params
            source: WORKSPACE

        - task_key: pl_fact_events
          job_cluster_key: ecommerce_job_cluster
          <<: *base_retry_parameters
          depends_on:
            - task_key: pl_event_clickstream_silver
            - task_key: pl_dim_date
            - task_key: pl_dim_time
            - task_key: pl_dim_session
            - task_key: pl_dim_user
            - task_key: pl_dim_geography
            - task_key: pl_dim_product
            - task_key: pl_dim_event_type
          notebook_task:
            notebook_path: ${var.databricks_repo_path}/Inzynierka_databricks/ecommerce/notebooks/gold/nb_fact_events
            base_parameters:
              <<: *base_params
            source: WORKSPACE
